# Render blueprint. Point Render at this repo and it builds the same Next.js app
# that Vercel runs - no separate backend, because the API routes live in it.
#
#   Render dashboard -> New -> Blueprint -> pick this repository
#
# DATABASE_URL is marked `sync: false`, so Render asks you for it on the first
# deploy. Paste your Neon (or Supabase) connection string there.
services:
  - type: web
    name: paisa
    runtime: node
    plan: free
    region: singapore
    rootDir: expense-tracker
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: 22.11.0
      - key: NODE_ENV
        value: production
      # Paste your Postgres connection string when Render prompts.
      - key: DATABASE_URL
        sync: false
      # Render generates a strong random value and keeps it across deploys.
      - key: AUTH_SECRET
        generateValue: true
      # Optional: restrict who can create an account on your instance.
      - key: ALLOWED_EMAILS
        sync: false

# Prefer Render's own Postgres over Neon? Uncomment this and change the
# DATABASE_URL entry above to read from it. Note Render's free database is
# deleted after 30 days; Neon's free tier is not.
#
# databases:
#   - name: paisa-db
#     plan: free
#     region: singapore
#     databaseName: paisa
#     user: paisa
