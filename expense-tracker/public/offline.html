<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Offline · Paisa</title>
    <style>
      :root { color-scheme: light; }
      body {
        margin: 0; min-height: 100dvh; display: grid; place-items: center;
        background: #f6f7f9; color: #0b0d12; padding: 24px;
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      }
      .card {
        max-width: 360px; text-align: center; background: #fff; border: 1px solid #e6e8ec;
        border-radius: 16px; padding: 32px 24px;
        box-shadow: 0 1px 3px rgba(11,13,18,.04);
      }
      .mark {
        width: 44px; height: 44px; border-radius: 12px; background: #2a78d6; color: #fff;
        display: grid; place-items: center; margin: 0 auto 16px; font-size: 20px; font-weight: 700;
      }
      h1 { font-size: 17px; margin: 0 0 6px; }
      p { font-size: 14px; line-height: 1.5; color: #4b5261; margin: 0 0 20px; }
      button {
        font: inherit; font-size: 14px; font-weight: 500; border: 0; border-radius: 12px;
        background: #2a78d6; color: #fff; padding: 10px 18px; cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="mark">₹</div>
      <h1>You are offline</h1>
      <p>Paisa needs a connection to read your numbers. Anything you were typing is still in the form once you reconnect.</p>
      <button onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>
